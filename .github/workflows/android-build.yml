name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug :testapp:assembleDebug

      - name: Upload CloneApp APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CA Test App APK
        uses: actions/upload-artifact@v4
        with:
          name: CA-Test-App-debug
          path: testapp/build/outputs/apk/debug/testapp-debug.apk
          if-no-files-found: error
