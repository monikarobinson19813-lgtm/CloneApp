[project]
name = "cloneapp-orchestrator"
version = "0.1.0"
description = "Persistent control-plane orchestrator for CloneApp engineering"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ca-orchestrator = "ca_orchestrator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
